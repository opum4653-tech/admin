name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "NINMODS Admin v1.0.3 (DriverLoader Bottom Sheets & Push Broadcast Suite)"
          body: |
            ### NINMODS Admin Android Console v1.0.3
            Major overhaul adhering strictly to APatch & DriverLoader design specifications:

            #### Key Updates in v1.0.3:
            - **All Center Dialogs Replaced with Bottom Sheets**: 100% of popups replaced with smooth bottom sheets sliding up from the bottom (identical to `DriverLoader` driver-load modal sheets). All housed inside dedicated `ui/dialogs/` package:
              - `BulkKeyGeneratorBottomSheet`
              - `KeyActionBottomSheet` (Extend validity, Reset HWID, Ban/Unban)
              - `UserActionBottomSheet` (3-dots user actions)
              - `UserInfoBottomSheet` (Full profile inspector)
              - `AdjustBalanceBottomSheet` (Credit/Debit wallet funds)
              - `ChangeRoleBottomSheet` (Role modification)
              - `ApproveDepositBottomSheet` & `RejectDepositBottomSheet`
              - `ManualDepositBottomSheet` (Admin manual wallet funding)
              - `SendNotificationBottomSheet` (In-App popup & image broadcasting)
              - `NewTicketBottomSheet` (Direct message dispatch)
              - `EditGameConfigBottomSheet` & `ChangePasswordBottomSheet`
            - **Real-Time Push Popups & Image Broadcasts**: Admin console can now push in-app modal popups, banners, and update notices directly to client devices with custom image URLs and priority levels.
            - **Messaging Page Floating Action Button (FAB)**: Support screen equipped with APatch-native FAB (`Icons.Filled.Add`) at bottom-right for initiating direct messages to users.
            - **APatch Drawer Alignment**: Side drawer edges flattened (`RectangleShape`), eliminating rounded corners to match APatch official UI rules.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
