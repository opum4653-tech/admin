name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "NINMODS Admin v1.0.2 (APatch Navigation Drawer & Full Suite Overhaul)"
          body: |
            ### NINMODS Admin Android Console v1.0.2
            Major overhaul according to official APatch / DriverLoader specifications:

            #### New Architecture & Features:
            - **1:1 Loader Login Replica**: Exact visual parity with `DriverLoader` (surface with `logo_n`, `RoundedCornerShape(22.dp)`, custom `TextField` styling with `surfaceVariant`, error container, 52.dp sign-in button).
            - **Standardized Dashboard Cards**: Uniform equal-height metric cards (`130.dp` primary, `96.dp` secondary) eliminating irregular layout dimensions. Documented in `docs/DASHBOARD_METRICS.md`.
            - **Bottom Navigation Completely Removed**: Replaced with APatch top hamburger menu button (`Icons.Filled.Menu`).
            - **Modal Navigation Drawer (Sidebar)**: APatch official drawer with quick navigation to all 8 operational suites.
            - **Users Suite with 3-Dots Action Dropdown**: Ban / Unban accounts, Reset HWID, Adjust wallet balances, Change role permissions, and view complete user profiles.
            - **License Keys Suite**: Bulk key generator, status filtering (Active, Unused, Expired, Banned), HWID resets, and time extensions.
            - **Support Live Messaging Suite**: Full customer support ticket thread viewer with bubble chat and admin reply composer.
            - **Deposits Suite**: Status filtering (Pending, Approved, Rejected, All), proof screenshot previewer, 1-tap Approve/Reject, and Manual Deposit credit modal.
            - **Anti-Shell Mod Upload**: Client & server-side inspection rejecting `.sh`, `.php`, `.py`, `.exe`, etc., zip entry traversal check, PK signature validation, directly updating `downloads/external/gemini-cli.zip` and `downloads/kernel/ninmods-kernel.zip`.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
