name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.1.3
            name: "NinMods Admin v1.1.3 (Clean Profile Card, No Balance Pill, No Tag)"
            body: |
              ### NinMods Admin Android Console v1.1.3
              Clean Sidebar Profile Card & Native Admin Console:

              #### Key Updates in v1.1.3:
              - **Clean Profile Card Layout**:
                - Removed diagonal ribbon tag (`SUPERADMIN` / `ADMIN`) from profile card.
                - Removed balance pill (`$0.00`) from sidebar (Admin manages system without personal balance).
                - Retained clean circular NinMods avatar and bold username.
              - **Floating Action Button (+)**:
                - Active across License Keys, Users & Resellers, Deposits, and Support Tickets.
              - **Backend Stability**:
                - Syntax and route synchronization verified.
            draft: false
            prerelease: false
            files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
