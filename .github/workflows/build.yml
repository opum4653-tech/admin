name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "NINMODS Admin v1.0.5 (Responsive Architecture & Dedicated Pages)"
          body: |
            ### NINMODS Admin Android Console v1.0.5
            Comprehensive layout flexibility and dedicated screen workflow overhaul:

            #### Key Updates in v1.0.5:
            - **100% Flexible & Responsive UI (`ResponsiveContentBox`)**: Standardized adaptive max-width container ensuring layouts never stretch awkwardly or break on tablets, foldables, or small phones.
            - **Dedicated Workflow Pages (Zero Awkward Bottom Sheets for Complex Flows)**:
              - `AdminGenerateKeyScreen`: Full dedicated page for license key generation with searchable user binding.
              - `AdminAddUserScreen`: Dedicated page to create new user accounts.
              - `AdminUserDetailScreen`: Dedicated full inspector page for user profile, balance adjustment (credit/debit), role modification, and ban moderation.
              - `AdminTicketChatScreen`: Dedicated ticket messaging thread with bubble history, user/admin chat, and status actions.
              - `AdminBroadcastScreen`: Full dedicated screen for pushing in-app modal popups, banners, and update notices.
            - **Single TopBar Title**: Minimal clean title beside drawer hamburger menu.
            - **All 8 Dashboard Cards Standardized**: Symmetrical `UniformMetricCard`s (112.dp height, zero font clipping).
            - **Branding & Privacy Sanitization**: Completely scrubbed APatch mentions, raw domain URLs, and server disk paths.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
