name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: "SMMTor / NINMODS Admin v1.1.2 (SMMTor UI Overhaul, Database Parity & Stealth Engine)"
          body: |
            ### SMMTor / NINMODS Admin Android Console v1.1.2
            SMMTor Website Theme Overhaul, Direct Database Integration, Backend Masking & Stealth Engine:

            #### Key Updates in v1.1.2:
            - **SMMTor Sidebar Profile Card & Menu Overhaul**:
              - Top brand header "SMMTor" in vibrant brand blue (`#007AFF`).
              - Modern rounded card with diagonal purple-magenta ribbon badge (`ADMIN`).
              - Circular avatar with pastel green background.
              - Bold administrator username display.
              - Vivid gradient balance pill displaying live user/admin currency balance.
              - High-contrast gradient action button ("New Order" -> Dashboard).
              - Matching SMMTor navigation list: Orders (Keys), Services (Users), Add Funds (Deposits), Tickets (Support), Api (Deploy), and expandable Show More options.
              - Removed logout / sign out section from sidebar drawer.
            - **Universal Database Parity & Nested Data Extraction**:
              - Unwrapped response extractor in `AdminApiClient` guaranteeing all arrays (users, keys, deposits, tickets, bugs, configs, plans) are safely parsed whether wrapped or root.
              - Complete backend stealth error handling masking all raw server exceptions, 503/500 HTML pages, and Java errors.
              - Direct database queries from backend controllers matching unified MySQL tables.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
