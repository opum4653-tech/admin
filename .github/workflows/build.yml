name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: "NINMODS Admin v1.1.1 (Complete Backend Error Masking, Friendly Alerts & Production Shield)"
          body: |
            ### NINMODS Admin Android Console v1.1.1
            Complete Backend Error Masking, Human-Friendly Alerts & Fail-Safe Network Engine:

            #### Key Updates in v1.1.1:
            - **Complete Backend Masking & Stealth Error Handling**: Raw Java/JSON/HTML exceptions (such as `Value <!DOCTYPE ... cannot be converted to JSONObject`) are 100% intercepted and replaced with clean, professional, human-friendly alerts. Backend paths, server headers, and software internals are completely invisible to end-users.
            - **Fail-Safe Response Reader**: `readResponse` now guarantees valid JSON structures regardless of server HTTP codes (503, 502, 500, 404), ensuring zero parser crashes.
            - **Standard Material 3 Floating Action Buttons (FAB)**: Full-width search bars and clean bottom-right FABs on Users, Keys, and Deposits screens.
            - **Triple-Layer Admin Authentication**: Automatic injection of authentication tokens across HTTP headers, query parameters, and JSON payloads.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
