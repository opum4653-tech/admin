name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.1.6
            name: "NinMods Admin v1.1.6 (Real Dashboard Report Graphs & Searchable User Dropdowns)"
            body: |
              ### NinMods Admin Android Console v1.1.6
              Real Dashboard Report Graphs & Searchable User Dropdowns:

              #### Key Updates in v1.1.6:
              - **Real Dashboard Visual Report Graphs**:
                - Interactive Key Inventory Health distribution chart (Active, Unused, Expired, Banned) with real proportional segments and live percentage chips.
                - Financial & Settlement Ledger telemetry card comparing circulating wallet funds with pending deposit backlog.
                - User Ecosystem Distribution card showing real-time proportions of standard users, resellers, and VIP accounts.
              - **Searchable User Dropdown System**:
                - Manual Deposit bottom sheet now features searchable user dropdown selector with username/email/ID filtering, live wallet balance, and 1-tap selection (zero manual ID typing).
                - Push Alert bottom sheet user targeting now features full searchable user selector when targeting individual clients.
              - **Drawer & UI Consistency**:
                - Clean header card without redundant balance pill or corner ribbons.
                - Default destination set to Dashboard immediately upon login.
                - Supports both wrapped and unwrapped JSON structures.
            draft: false
            prerelease: false
            files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
