name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.1.4
            name: "NinMods Admin v1.1.4 (Searchable User Dropdown for Direct Messages & Clean Console)"
            body: |
              ### NinMods Admin Android Console v1.1.4
              Searchable User Dropdown for Direct Messages & Support:

              #### Key Updates in v1.1.4:
              - **Searchable User Selector Dropdown for Direct Messages**:
                - No manual ID entry required; instant live search across username, email, and ID.
                - Dropdown card display with initial avatar, username, email, and role badge.
                - One-tap selection and clear/change action.
              - **Support & Messages Hub**:
                - Search bar for quick filtering by ticket ID, user, or topic.
                - Direct conversation thread with full user chat view.
              - **Clean Profile Card**:
                - SuperAdmin tag ribbon and balance pill removed from drawer.
            draft: false
            prerelease: false
            files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
