name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "NINMODS Admin v1.0.4 (Dedicated Workflow Pages & Metric Alignment)"
          body: |
            ### NINMODS Admin Android Console v1.0.4
            Refinement and privacy hardening:

            #### Key Updates in v1.0.4:
            - **All 8 Dashboard Metric Cards Standardized**: Symmetrical `UniformMetricCard`s (112.dp height, centered typography, zero font clipping or overflow across all 8 telemetry points).
            - **Dedicated Workflow Pages**:
              - `AdminGenerateKeyScreen`: Full dedicated page for license key generation with searchable user binding dropdown, quantity stepper, duration presets, engine selector, and device limits.
              - `AdminAddUserScreen`: Dedicated page to create new user accounts with role selection and initial wallet balance.
            - **Branding & Privacy Hardening**:
              - All APatch branding, links, and backend doc references scrubbed from UI.
              - Mod Upload and Settings screens stripped of raw backend domain URLs, server plate lines, and file paths.
            - **Clean TopBar Title**: Single clean title displayed beside drawer menu button (e.g. "Dashboard", "Users", etc.) without subtitle duplication.
            - **Loading Progress Spinners**: Action buttons now feature official `CircularProgressIndicator` during asynchronous tasks.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
