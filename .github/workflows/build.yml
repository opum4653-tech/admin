name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: "NINMODS Admin v1.0.9 (Enterprise SQL Schema, Client Bug Reporting & Anti-Wrap Layouts)"
          body: |
            ### NINMODS Admin Android Console v1.0.9
            Enterprise Database Architecture, Diagnostic Telemetry & Dynamic Navigation:

            #### Key Updates in v1.0.9:
            - **Enterprise SQL Schema Alignment**: Fully matched with business-class `database.sql` supporting unified `users`, `admins`, `license_keys`, `deposits`, `tickets`, `bug_reports`, and `broadcasts`.
            - **Dynamic Sub-Screen TopBar Navigation**: Replaced the 3-line hamburger menu with a Back button (`ArrowBack`) on all edit and detail screens (`Generate Keys`, `Add User`, `User Profile`, `Ticket Chat`, `Bug Reports`). Eliminated all duplicate internal back arrows and redundant header cards.
            - **Anti-Wrapping Adaptive Layouts**: Converted Priority Level chips in Push Alerts and Duration presets into horizontal scroll rows with `maxLines = 1` and `softWrap = false`, preventing awkward multi-line syllable breaks ("Warnin/g", "App/Updat/e").
            - **Client Bug Reports Inspection Screen**: Added dedicated screen to inspect diagnostic crash traces and telemetry submitted from the client loader app with instant status resolution.
            - **Loader In-App Popups & Banners Integration**: Synchronized broadcast announcements so broadcasts created in the admin panel are immediately presented as modal alerts and banner cards in the loader app.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
