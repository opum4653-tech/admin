name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "NINMODS Admin v1.0.1 (Official APatch UI)"
          body: |
            ### NINMODS Admin Android Console v1.0.1
            Official dedicated Admin Android application rebuilt with 100% 1:1 replica of the official APatch / DriverLoader design system and navigation architecture.

            #### APatch UI Features:
            - **APatch TopAppBar**: Header with title, live refresh action, and top-right profile icon (`ic_user_profile`) linking to Admin Profile subpage.
            - **APatch BottomNavigationBar**: Rounded pill surface (`RoundedCornerShape(topStart = 28.dp, topEnd = 28.dp)`) with official drawables (`ic_nav_home_fill` / `ic_nav_home`, `ic_nav_wrench`, `ic_nav_gear`).
            - **APatch Screen Transitions**: 340ms horizontal slide + fade in/out for Profile and 340ms crossfade between tabs.
            - **Elevated Status Cards**: 20.dp rounded elevated cards, side-by-side metric badges (Active Keys, Users in DB, Total Balance, Deposits Queue), and `SwitchItem` configuration controls.
            - **Management Suite**: Clean sub-tab pills for License Keys (with HWID reset, time extensions, ban/unban), User Accounts (credit/deduct, role promotion), and Pending Deposits.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
