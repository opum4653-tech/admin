name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.1.7
            name: "NinMods Admin v1.1.7 (User Keys Management & Hardware Binding Control)"
            body: |
              ### NinMods Admin Android Console v1.1.7
              User Keys Inventory & Hardware Binding Telemetry:

              #### Key Updates in v1.1.7:
              - **Account VIP Keys Telemetry**:
                - Directly displays all active and unused VIP license keys assigned to the specific user profile.
                - 1-tap clipboard copy button and real-time validity metrics.
              - **Hardware Device & HWID Reset Control**:
                - Displays bound client hardware model and raw HWID string.
                - 1-tap "Reset HWID" button to instantly unbind devices without leaving the user profile.
              - **Full Server & Database Synchronization**:
                - Verified end-to-end against production database and REST endpoints.
                - Completely replaces legacy manual ID typing with intelligent searchable selectors across all admin dialogs.
            draft: false
            prerelease: false
            files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
