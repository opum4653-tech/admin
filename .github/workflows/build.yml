name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v1.1.5
            name: "NinMods Admin v1.1.5 (Push Alerts Card List with Floating FAB & Real-Time Sync)"
            body: |
              ### NinMods Admin Android Console v1.1.5
              Push Alerts Cards & Floating Plus Component + Real-Time Support Polling:

              #### Key Updates in v1.1.5:
              - **Push Alerts Page Overhaul**:
                - Full card list view for active and past broadcast alerts.
                - Severity badges (`URGENT`, `WARNING`, `UPDATE`, `INFO`) and format pill (`MODAL POPUP` / `BANNER`).
                - Delete alert button with instant revocation confirmation dialog.
                - Floating Action Button (+) positioned at bottom-right for composing new alerts via `CreateBroadcastBottomSheet`.
              - **Real-Time Live Polling**:
                - Automatic 4-second sync for tickets and messages without manual refresh.
                - Immediate live updates when users submit or reply to tickets.
              - **Resilient API Envelope Parsing**:
                - Supports both wrapped and unwrapped JSON structures.
            draft: false
            prerelease: false
            files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
