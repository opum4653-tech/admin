name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "NINMODS Admin v1.0.8 (Unified Database Bridge, Enterprise Components & Realtime User Sync)"
          body: |
            ### NINMODS Admin Android Console v1.0.8
            Unified Database Integration & Component System:

            #### Key Updates in v1.0.8:
            - **Unified Database Bridge**: Unified the database authentication and queries between the user loader app and admin console; accounts registered through the user loader now sync in real-time to the dashboard and users directory.
            - **Resilient Dashboard & User Querying**: Wrapped database statistics in COALESCE null-safe queries with individual try/catch blocks; user counts and wallet totals are never blocked by optional secondary tables.
            - **Enterprise Component System**: Upgraded all screens with standard components:
              - `AdminCard`: Unified section container across Settings, Mod Upload, and Profile.
              - `AdminEmptyState`: Standard centered empty-state display across Keys, Users, Deposits, and Support.
              - `AdminSearchBar` & `AdminSearchAndActionRow`: Standard search input with integrated primary action button.
              - `AdminFilterChipRow`: Smooth horizontal filter pill row with zero text-wrapping.
              - `AdminDetailRow`: Standard key-value metadata rows.
            - **Synchronous Coroutine Scope**: Refreshed `AdminViewModel.refreshAll()` to await all data sources before dismissing progress state and handle session invalidation cleanly.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
