name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "NINMODS Admin v1.0.7 (Unified TopBar Back Navigation & Zero Duplicate Headers)"
          body: |
            ### NINMODS Admin Android Console v1.0.7
            Unified navigation architecture & header refinement:

            #### Key Updates in v1.0.7:
            - **Unified TopBar Back Navigation**: Sub/edit pages (`Generate Keys`, `Add User`, `User Profile`, `Ticket Thread`) dynamically replace the 3-line hamburger menu with the official Back Arrow (`ArrowBack`), providing seamless standard Android hierarchy.
            - **Zero Duplicate Headers**: Removed all redundant internal back buttons and duplicate title rows inside sub-screens; all titles and navigation now render solely in the system `TopAppBar`.
            - **Anti-Wrapping 2x2 Chip Grid**: Eliminated multi-line broken chip text ("Inform ation", "Warnin g") across all alert and configuration selectors.
            - **Architecture Documentation Added**: Created comprehensive `DOCS.md` detailing the navigation doctrine, responsive grid system, and 100% backend data contract parity.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
