name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "NINMODS Admin v1.0.6 (Zero Text-Wrapping & Chip Grid Alignment)"
          body: |
            ### NINMODS Admin Android Console v1.0.6
            Critical UI alignment & responsive layout perfection:

            #### Key Updates in v1.0.6:
            - **Fixed Chip Word-Wrapping**: Eliminated awkward broken multi-line words ("Inform ation", "Warnin g", "App Updat e") by upgrading priority and role selectors to a symmetrical 2x2 grid and horizontal-scroll containers.
            - **TopBar Title Anti-Clipping**: Shortened top bar titles (e.g. "Push Alerts") ensuring clean rendering without ellipsis truncation beside action icons.
            - **Anti-Overflow Adaptive Layout**: Guaranteed single-line chip labels with natural padding across small phones and large tablets alike.
            - **100% Dedicated Workflows**: Maintained full-screen pages for Key Generation, User Details, Account Creation, Ticket Chat, and Broadcast Alerts.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
