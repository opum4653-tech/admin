name: Build NINMODS Admin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Admin Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINMODS-Admin-Release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "NINMODS Admin v1.1.0 (Standard M3 FAB Overhaul, Full-Width Search & Unbreakable Admin Auth)"
          body: |
            ### NINMODS Admin Android Console v1.1.0
            Standard Material 3 FAB Overhaul, Full-Width Search & Fail-Safe Admin Auth:

            #### Key Updates in v1.1.0:
            - **Standard Material 3 Floating Action Buttons (FAB)**: Moved "Add User", "Generate Keys", and "Add Manual Deposit" from the top search row down to standard bottom-right Floating Action Buttons, matching the Support screen style perfectly.
            - **Spacious Full-Width Search & Filter Layouts**: Eliminated search bar squeezing and layout clipping on Users, Keys, and Deposits screens.
            - **Unbreakable Admin Auth Routing**: Resolved "Admin authentication key required" error by injecting authentication tokens via HTTP Headers, URL Query parameters, and JSON payloads simultaneously, ensuring resilience against reverse proxy header-stripping.
            - **Unified Database & Backend Parity**: Full synchronization with all 16 business-class tables in `database.sql`.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
